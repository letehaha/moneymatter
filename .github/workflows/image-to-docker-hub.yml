name: Update images on VPS

on:
  workflow_run:
    workflows: ['Lint, Test and Build']
    types:
      - completed
    branches: [main]
  workflow_dispatch:

# Deploys run in push order so an older run can't overwrite a newer `latest`.
# Never cancel in progress: that could cut off the database backup mid-dump.
concurrency:
  group: image-to-docker-hub
  cancel-in-progress: false

jobs:
  # Create database backup before deployment
  backup:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository) }}
    uses: ./.github/workflows/database-backup.yml
    with:
      backup_reason: 'pre-deployment'
    secrets: inherit

  prepare:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      sha_short: ${{ steps.vars.outputs.sha_short }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check if user is authorized
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.actor }}" != "letehaha" ]]; then
            echo "Error: Only letehaha can manually trigger this workflow"
            exit 1
          fi
          echo "User authorized: ${{ github.actor }}"

      # Never use github.sha directly: on workflow_run it is the default branch head, not the validated commit.
      - id: vars
        run: |
          echo "sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=${BUILD_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Only main builds get a `v*` tag: a dispatch defaults to dev, which
      # already carries the next release's version.
      - if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.vars.outputs.sha }}
          sparse-checkout: packages/frontend/package.json
          sparse-checkout-cone-mode: false

      - id: version
        if: github.event_name == 'workflow_run'
        run: |
          VERSION=$(jq -r .version packages/frontend/package.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version in packages/frontend/package.json: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # always(): a failed backup must not block the deploy.
  build-frontend:
    needs: [backup, prepare]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # `v*` tags are immutable: pushed only if missing, so a hotfix without a
      # version bump moves `latest` and `sha-*` but never `v*`. Checked right
      # before pushing so re-running a failed job can't re-push an existing tag.
      - id: fe_version
        if: needs.prepare.outputs.version != ''
        env:
          IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/budget-tracker-fe
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ref="$IMAGE:v$VERSION"
          if err=$(docker buildx imagetools inspect "$ref" 2>&1 >/dev/null); then
            echo "$ref already exists, not re-tagging"
          elif [[ "$err" == *"$ref: not found" ]]; then
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check $ref: $err"
            exit 1
          fi

      # This image is the self-host image: letehaha/budget-tracker-fe is what
      # self-hosters pull. Deployment-specific values (API origin, analytics
      # keys, CSP hosts) belong to whoever runs the container, not to this
      # build — they enter at container start via the entrypoint's runtime
      # env, so only build-identity and source-map-upload inputs go here.
      - uses: ./.github/actions/frontend-docker-build
        with:
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ secrets.SENTRY_ORG }}
          sentry-project: ${{ secrets.SENTRY_PROJECT }}
          sentry-release: ${{ needs.prepare.outputs.sha }}
          app-commit-hash: ${{ needs.prepare.outputs.sha }}
          docker-hub-username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker-hub-access-token: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          image-tag: latest,sha-${{ needs.prepare.outputs.sha_short }},${{ steps.fe_version.outputs.tag }}
          # Only the small nginx stage runs per arch, so arm64 stays cheap here.
          platforms: linux/amd64,linux/arm64
          push: 'true'

  build-backend:
    needs: [backup, prepare]
    if: ${{ always() && needs.prepare.result == 'success' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: ./.github/actions/backend-docker-build
        with:
          docker-hub-username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker-hub-access-token: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          sentry-release: ${{ needs.prepare.outputs.sha }}
          image-tag: sha-${{ needs.prepare.outputs.sha_short }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          push: 'true'

  # Each arch builds natively on its own runner; this stitches both into the
  # multi-arch `latest`, `sha-*` and (when new) `v*` tags.
  merge-backend:
    needs: [prepare, build-backend]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build-backend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - env:
          IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/budget-tracker-be
          SHA_TAG: sha-${{ needs.prepare.outputs.sha_short }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          VERSION_TAG=
          if [[ -n "$VERSION" ]]; then
            ref="$IMAGE:v$VERSION"
            if err=$(docker buildx imagetools inspect "$ref" 2>&1 >/dev/null); then
              echo "$ref already exists, not re-tagging"
            elif [[ "$err" == *"$ref: not found" ]]; then
              VERSION_TAG="v$VERSION"
            else
              echo "::error::Could not check $ref: $err"
              exit 1
            fi
          fi
          docker buildx imagetools create -t "$IMAGE:$SHA_TAG" -t "$IMAGE:latest" \
            ${VERSION_TAG:+-t "$IMAGE:$VERSION_TAG"} \
            "$IMAGE:$SHA_TAG-amd64" "$IMAGE:$SHA_TAG-arm64"

  deploy:
    needs: [build-frontend, merge-backend]
    if: ${{ !cancelled() && needs.build-frontend.result == 'success' && needs.merge-backend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deployment
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}" | grep -q "200" \
            || (echo "Dokploy deploy webhook failed" && exit 1)
