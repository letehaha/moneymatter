name: Docs

on:
  pull_request:
    paths: ['packages/docs/**']
  push:
    branches: [main]
    paths: ['packages/docs/**']
  workflow_dispatch:

jobs:
  # The build fails on broken internal links (starlight-links-validator) and invalid MDX.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/docs/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./packages/docs
          push: true
          tags: |
            letehaha/budget-tracker-docs:latest
            letehaha/budget-tracker-docs:sha-${{ github.sha }}
      - name: Trigger Dokploy deployment
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.DOKPLOY_DOCS_DEPLOY_WEBHOOK_URL }}" | grep -q "200" \
            || (echo "Dokploy docs deploy webhook failed" && exit 1)
