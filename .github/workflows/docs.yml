name: Docs

on:
  pull_request:
    paths: ['packages/docs/**']
  push:
    branches: [main]
    paths: ['packages/docs/**']
  workflow_dispatch:

jobs:
  # The build fails on broken internal links (starlight-links-validator) and invalid MDX.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/docs/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./packages/docs
          push: true
          tags: |
            letehaha/budget-tracker-docs:latest
            letehaha/budget-tracker-docs:sha-${{ github.sha }}
      - name: Trigger Dokploy deployment
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.DOKPLOY_DOCS_DEPLOY_WEBHOOK_URL }}" | grep -q "200" \
            || (echo "Dokploy docs deploy webhook failed" && exit 1)
