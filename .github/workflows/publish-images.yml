name: Publish Docker images and deploy

on:
  workflow_run:
    workflows: ['Lint, Test and Build']
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Create database backup before deployment
  backup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/database-backup.yml
    with:
      backup_reason: 'pre-deployment'
    secrets: inherit

  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Check if user is authorized
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.actor }}" != "elwin" && "${{ github.actor }}" != "${{ github.repository_owner }}" && "${{ github.actor }}" != "letehaha" ]]; then
            echo "Error: Only authorized users can manually trigger this workflow"
            exit 1
          fi
          echo "User authorized: ${{ github.actor }}"

      # Never use github.sha directly: on workflow_run it is the default branch head, not the validated commit.
      - id: vars
        run: |
          echo "sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=${BUILD_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

  # always(): a failed backup must not block the deploy.
  build-frontend:
    needs: [backup, prepare]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # This image is the self-host image: ghcr.io/elwin/moneymatter/frontend is what
      # self-hosters pull. Deployment-specific values (API origin, analytics
      # keys, CSP hosts) belong to whoever runs the container, not to this
      # build — they enter at container start via the entrypoint's runtime
      # env, so only build-identity and source-map-upload inputs go here.
      - uses: ./.github/actions/frontend-docker-build
        with:
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ secrets.SENTRY_ORG }}
          sentry-project: ${{ secrets.SENTRY_PROJECT }}
          sentry-release: ${{ needs.prepare.outputs.sha }}
          app-commit-hash: ${{ needs.prepare.outputs.sha }}
          image-tag: latest,sha-${{ needs.prepare.outputs.sha_short }}
          # Prod VPS is amd64, so build single-arch (fast, native, no QEMU). The
          # actions still accept a `platforms` input — add linux/arm64 here to
          # publish multi-arch images for ARM self-hosters when that's wanted.
          push: 'true'

  build-backend:
    needs: [backup, prepare]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: ./.github/actions/backend-docker-build
        with:
          sentry-release: ${{ needs.prepare.outputs.sha }}
          image-tag: latest,sha-${{ needs.prepare.outputs.sha_short }}
          push: 'true'

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_URL" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK_URL is not set. Skipping Dokploy deployment."
            exit 0
          fi
          curl -s -o /dev/null -w "%{http_code}" \
            "$DOKPLOY_URL" | grep -q "200" \
            || (echo "Dokploy deploy webhook failed" && exit 1)
