name: Preview Teardown

on:
  pull_request_target:
    types: [closed, unlabeled]

permissions:
  pull-requests: write

# Same group as preview-deploy.yml: queuing a teardown cancels an in-flight
# deploy, which would otherwise bring the stack back up right after `down`.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  teardown:
    runs-on: ubuntu-latest
    # Tear down when PR with 'preview' label is closed, OR when 'preview' label is removed.
    # Keep the base.ref list in sync with preview-deploy.yml, or previews for the
    # missing branch deploy and never tear down.
    if: >-
      contains(fromJSON('["main", "dev"]'), github.event.pull_request.base.ref)
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview'))
        || (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
      )

    steps:
      - name: Tear down preview environment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VPS_PREVIEW_BASE_PATH: ${{ secrets.VPS_PREVIEW_BASE_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          envs: PR_NUMBER,VPS_PREVIEW_BASE_PATH
          script: |
            set -e
            PR_DIR="$VPS_PREVIEW_BASE_PATH/pr-$PR_NUMBER"

            if [ -d "$PR_DIR" ]; then
              cd "$PR_DIR"

              export PR_NUMBER
              # Read PREVIEW_DB_PASSWORD from .env (needed for compose interpolation)
              if [ -f .env ]; then
                export PREVIEW_DB_PASSWORD=$(grep '^PREVIEW_DB_PASSWORD=' .env | cut -d'=' -f2-)
              fi

              # Stop and remove containers, volumes, and orphans
              docker compose -f docker-compose.preview.yml -p preview-pr-$PR_NUMBER down -v --remove-orphans 2>/dev/null || true

              # Remove the PR directory
              rm -rf "$PR_DIR"

              # Remove Docker images
              docker rmi "letehaha/budget-tracker-fe:pr-$PR_NUMBER" 2>/dev/null || true
              docker rmi "letehaha/budget-tracker-be:pr-$PR_NUMBER" 2>/dev/null || true
              docker rmi "letehaha/budget-tracker-docs:pr-$PR_NUMBER" 2>/dev/null || true

              # Prune dangling images
              docker image prune -f 2>/dev/null || true

              echo "Preview environment for PR #$PR_NUMBER torn down successfully!"
            else
              echo "No preview environment found for PR #$PR_NUMBER"
            fi

      # Non-blocking: a failed delete only leaves a stale tag behind, so it
      # warns instead of failing the teardown.
      - name: Delete preview image tags from Docker Hub
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          TOKEN=$(jq -n --arg u "$DOCKER_HUB_USERNAME" --arg p "$DOCKER_HUB_ACCESS_TOKEN" '{username: $u, password: $p}' \
            | curl -sS -H 'Content-Type: application/json' -d @- https://hub.docker.com/v2/users/login \
            | jq -r '.token // empty')

          for repo in budget-tracker-fe budget-tracker-be budget-tracker-docs; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "https://hub.docker.com/v2/repositories/letehaha/$repo/tags/pr-$PR_NUMBER/")
            case "$status" in
              204|404) echo "$repo:pr-$PR_NUMBER -> HTTP $status" ;;
              *) echo "::warning::Could not delete $repo:pr-$PR_NUMBER from Docker Hub (HTTP $status)" ;;
            esac
          done

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-env
          message: |
            ## Preview Environment

            :wastebasket: Preview environment for PR #${{ env.PR_NUMBER }} has been torn down.
