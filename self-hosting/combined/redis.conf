# Redis configuration for MoneyMatter Combined container
# Runs locally on loopback interface only (not exposed externally)
bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
timeout 0
tcp-keepalive 300
supervised no
loglevel notice
logfile ""
databases 16

# Redis in MoneyMatter is used for job queues, status, and transient locks.
# Disable RDB snapshots to avoid unnecessary disk I/O and keep operations in-memory.
save ""
appendonly no
dir /data/redis
