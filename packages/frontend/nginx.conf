worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  # Temp paths for non-root user
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  # Register markdown extension for agent content negotiation.
  # Multiple types{} blocks at the same level merge in nginx.
  types {
    text/markdown md;
  }
  default_type  application/octet-stream;

  # Markdown-for-Agents content negotiation: serve .md variant when
  # Accept: text/markdown is present; fall back to HTML otherwise.
  map $http_accept $landing_index_file {
    default           /index.html;
    "~*text/markdown" /index.md;
  }
  map $http_accept $landing_privacy_file {
    default           /privacy-policy/index.html;
    "~*text/markdown" /privacy-policy.md;
  }
  map $http_accept $landing_terms_file {
    default           /terms-of-use/index.html;
    "~*text/markdown" /terms-of-use.md;
  }

  # Keeps the app shell out of search indexes; sign-in and sign-up stay
  # indexable. add_header emits nothing for an empty value.
  map $request_uri $app_shell_robots {
    default                 "noindex";
    "~^/sign-(in|up)(\?|$)" "";
  }

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  keepalive_timeout  65;

  # Hide nginx version
  server_tokens off;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/javascript application/json application/xml
             application/xml+rss image/svg+xml;

  server {
    # envsubst'd by the container entrypoint from LISTEN_PORT (default 80).
    listen       ${LISTEN_PORT};
    server_name  _;
    # Relative Location headers: behind a reverse proxy the absolute form would
    # carry this container's listen port instead of the operator's public one.
    absolute_redirect off;

    # Content-Security-Policy for the SPA.
    #   script-src:   'unsafe-eval' for PostHog Function constructor + Sentry replay.
    #   style-src:    'unsafe-inline' for Vue 3 / Tailwind runtime style injection.
    #   connect-src:  ${CSP_EXTRA_CONNECT} is the API host (defaults to $API_HTTP).
    #                 ${CSP_EXTRA_ANALYTICS} holds optional PostHog/Sentry hosts —
    #                 it defaults to $POSTHOG_HOST alone, so a deployment using
    #                 Sentry must set it explicitly or error reports are blocked.
    #                 Iconify hosts are always whitelisted (the icon library used
    #                 by the app loads them at runtime).
    #   form-action:  ${CSP_EXTRA_FORM_ACTION} for OAuth POST flows to the API host.
    #   frame-src:    blob: for the attachment viewer, which iframes PDFs as blob URLs.
    # NOTE: must live inside `server` (or location/if) — `set` is NOT valid at http scope.
    # NOTE: ${...} placeholders are envsubst'd by the container entrypoint at
    #       startup, NOT nginx variables.
    set $csp_policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ${CSP_EXTRA_CONNECT} ${CSP_EXTRA_ANALYTICS} https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${CSP_EXTRA_FORM_ACTION}; object-src 'none'";

    # CSP for the static Astro landing pages (/, /privacy-policy, /terms-of-use).
    # Astro emits a few small inline <script> blocks to bootstrap astro-island
    # hydration; without 'unsafe-inline' those are blocked and Vue islands never
    # wire up their click handlers. All other directives match $csp_policy.
    # Same envsubst rules as $csp_policy — see comment above.
    set $csp_policy_landing "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ${CSP_EXTRA_CONNECT} ${CSP_EXTRA_ANALYTICS} https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${CSP_EXTRA_FORM_ACTION}; object-src 'none'";

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy $csp_policy always;

    # Import endpoints receive uploaded files base64-encoded inside a JSON body.
    # The backend caps each file at 10 MB, which is ~13.3 MB once base64-encoded;
    # 15m leaves headroom above that. Set at server scope so it is inherited by
    # the entrypoint-generated `location /api/` proxy include below (nginx's
    # default is 1 MB, which would 413 any import larger than ~750 KB).
    client_max_body_size 15m;

    # Entrypoint-generated optional /api reverse proxy. The container
    # entrypoint writes /etc/nginx/includes/api-proxy.conf: a `location /api/`
    # block proxying to BACKEND_URL when that env var is set (same-origin
    # mode), or an empty file otherwise so nginx starts without it.
    include /etc/nginx/includes/*.conf;

    # PostHog reverse proxy (bypasses ad blockers)
    # ^~ ensures these take priority over regex locations (like \.js$)
    # /helper/static/ must come first — PostHog SDK loads scripts from this path,
    # and they live on the assets CDN, not the API server.
    # Upstream hostnames are variables so nginx re-resolves them per request
    # (PostHog's load balancer IPs rotate) and TLS is verified so a reclaimed
    # IP can't impersonate PostHog.
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    set $posthog_api_host eu.i.posthog.com;
    set $posthog_assets_host eu-assets.i.posthog.com;

    # With a variable in proxy_pass, a URI part would replace the WHOLE request
    # URI (dropping path + query), so strip the prefix via rewrite instead.
    location ^~ /helper/static/ {
      rewrite ^/helper/static/(.*)$ /static/$1 break;
      proxy_pass https://$posthog_assets_host;
      proxy_set_header Host $posthog_assets_host;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_ssl_server_name on;
      proxy_ssl_name $posthog_assets_host;
    }

    location ^~ /helper/ {
      rewrite ^/helper/(.*)$ /$1 break;
      proxy_pass https://$posthog_api_host;
      proxy_set_header Host $posthog_api_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_ssl_server_name on;
      proxy_ssl_name $posthog_api_host;
    }

    # --- Astro landing pages ---

    # Serve Astro landing for exact "/" route
    location = / {
      # envsubst'd by the container entrypoint: `return 302 /dashboard;` when
      # SKIP_LANDING=true, empty otherwise.
      ${LANDING_REDIRECT}

      root   /landing;
      # Content negotiation: $landing_index_file resolves to /index.html
      # by default, or /index.md when Accept: text/markdown is sent.
      try_files $landing_index_file =404;

      # Re-declare server-level security headers (nginx does not inherit
      # add_header once any add_header is set at this level).
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
      add_header Content-Security-Policy $csp_policy_landing always;

      # Agent discovery (RFC 8288) — expose well-known resources via Link headers
      add_header Link '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
      add_header Link '</.well-known/mcp/server-card.json>; rel="service-desc"; type="application/json"' always;
      add_header Link '</terms-of-use>; rel="terms-of-service"' always;
      add_header Link '</privacy-policy>; rel="privacy-policy"' always;

      # Caches must key on Accept header because we content-negotiate HTML/Markdown
      add_header Vary "Accept" always;
    }

    # Serve Astro legal pages
    location = /privacy-policy {
      root   /landing;
      try_files $landing_privacy_file =404;

      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
      add_header Content-Security-Policy $csp_policy_landing always;

      add_header Link '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
      add_header Link '</terms-of-use>; rel="terms-of-service"' always;

      add_header Vary "Accept" always;
    }
    location = /terms-of-use {
      root   /landing;
      try_files $landing_terms_file =404;

      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
      add_header Content-Security-Policy $csp_policy_landing always;

      add_header Link '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
      add_header Link '</privacy-policy>; rel="privacy-policy"' always;

      add_header Vary "Accept" always;
    }

    # Starts a demo session on load, so the demo has a URL that can be linked.
    location = /demo {
      ${LANDING_REDIRECT}

      root   /landing;
      try_files /demo/index.html =404;

      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
      add_header Content-Security-Policy $csp_policy_landing always;
    }

    location = /demo/ {
      return 301 /demo;
    }

    # Astro landing sections with many pages. Astro builds each page to
    # <path>/index.html; the slashless URL is the canonical one.
    location ^~ /alternatives/ {
      ${LANDING_REDIRECT}

      rewrite ^(.+)/$ $1 permanent;

      root   /landing;
      try_files $uri/index.html =404;

      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
      add_header Content-Security-Policy $csp_policy_landing always;
    }

    # --- Agent discovery well-known paths ---

    # RFC 9727: /.well-known/api-catalog must return application/linkset+json.
    # File has no extension, so default_type is required.
    location = /.well-known/api-catalog {
      root /app;
      default_type "application/linkset+json";
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # OAuth discovery metadata (RFC 8414 + RFC 9728) and the /mcp endpoint are
    # NOT declared here. Their locations are written by the container
    # entrypoint into /etc/nginx/includes/oauth-mcp.conf (included above),
    # because what they must do depends on the deployment:
    #   - BACKEND_URL set (same-origin): proxy to the backend, whose metadata
    #     is built from MCP_BASE_URL and therefore names this deployment.
    #   - BACKEND_URL unset (split-domain): serve the static mirrors from
    #     /app/.well-known/ — baked with the hosted deployment's URLs and
    #     rewritten by the entrypoint to MCP_BASE_URL when that is set.
    # Declaring them here as well would be a duplicate `location` and nginx
    # would refuse to start.

    # MCP Server Card (SEP-1649 draft). Content-Type is inferred from the
    # .json extension via mime.types — this location just adds CORS + cache.
    location = /.well-known/mcp/server-card.json {
      root /app;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # RFC 9116 — security disclosure contact. Without an explicit location the
    # SPA fallback would return index.html. Both URIs (well-known + legacy root)
    # are kept so older scanners still find it.
    location = /.well-known/security.txt {
      root /app;
      default_type "text/plain";
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
    location = /security.txt {
      root /app;
      try_files /.well-known/security.txt =404;
      default_type "text/plain";
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Agent Skills Discovery RFC v0.2.0 — catalog of SKILL.md docs for agents.
    location = /.well-known/agent-skills/index.json {
      root /app;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Skill docs referenced from the agent-skills index. Content-Type is set
    # to text/markdown via the http-level types{} block (see #2). Agents
    # verify the file against the sha256 in the index, so CORS is required.
    location ^~ /skills/ {
      root /app;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Serve Astro static assets (hashed, immutable)
    # ^~ ensures this takes priority over regex locations like \.css$
    location ^~ /_astro/ {
      root   /landing;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Sitemap — generated by @astrojs/sitemap from packages/landing's known
    # routes. Index file + paginated children. Crawlers fetch the index first.
    # Old /sitemap.xml URL is redirected for any historical bookmarks.
    location = /sitemap-index.xml {
      root /landing;
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/sitemap-\d+\.xml$ {
      root /landing;
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
    location = /sitemap.xml {
      return 301 /sitemap-index.xml;
    }

    # Images: try landing first, then frontend
    # ^~ ensures this takes priority over regex image location
    location ^~ /img/ {
      root   /landing;
      try_files $uri @frontend_img;
    }
    location @frontend_img {
      root   /app;
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # --- SPA static assets ---

    # Cache static assets with hashed filenames (immutable, 1 year)
    location ~* \.(?:js|css)$ {
      root   /app;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Cache fonts (1 year)
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
      root   /app;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Cache images (1 week, they may be updated)
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico)$ {
      root   /app;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Deploy probe. Must never be cached — the running app polls this every
    # 60s to compare against its build-time hash and prompt a reload when the
    # server has a newer build.
    location = /version.json {
      root /app;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Runtime config shim. The container entrypoint rewrites /app/config.js per
    # container, so it must never be cached — an exact-match location outranks
    # the immutable `\.js$` rule that would otherwise pin it for a year.
    location = /config.js {
      root /app;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # The app shell, reached through the SPA fallback below. The browser must
    # always re-fetch it so a fresh deploy's hashed asset references aren't
    # served from cache.
    location = /index.html {
      root   /app;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag $app_shell_robots always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
      add_header Content-Security-Policy $csp_policy always;
    }

    # All other routes: static files from the app build, else the app shell.
    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store" always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
      add_header Content-Security-Policy $csp_policy always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
